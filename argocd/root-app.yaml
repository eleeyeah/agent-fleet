apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: agent-fleet-root
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io/background
spec:
  project: default
  destination:
    namespace: argocd
    server: https://kubernetes.default.svc
  source:
    # Set once — see REPO.md
    repoURL: git@github.com:eleeyeah/agent-fleet.git
    targetRevision: HEAD
    path: argocd/project
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
