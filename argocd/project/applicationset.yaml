apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: agent-fleet
  namespace: argocd
spec:
  generators:
    - list:
        elements:
          # Local kubeadm now; add eks after the EKS lift (Phase 3)
          - env: local
          # - env: eks
  template:
    metadata:
      name: "agent-fleet-{{env}}"
      namespace: argocd
      finalizers:
        - resources-finalizer.argocd.argoproj.io/background
    spec:
      project: agent-fleet
      source:
        repoURL: git@github.com:eleeyeah/agent-fleet.git
        targetRevision: HEAD
        path: envs/{{env}}
        directory:
          recurse: true
      destination:
        server: https://kubernetes.default.svc
        namespace: argocd
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
          allowEmpty: false
        syncOptions:
          - Validate=true
          - CreateNamespace=true
          - PrunePropagationPolicy=foreground
          - PruneLast=true
