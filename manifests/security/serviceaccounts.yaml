# One ServiceAccount per agent role (risk #1). None of the Phase 1 agents talk to the
# Kubernetes API, so no Roles/RoleBindings exist and API tokens are never mounted.
# When the DevOps agent arrives (Phase 2) it gets its own SA with an explicit,
# read-only Role — never reuse these.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pm-agent
  namespace: fleet-agents
automountServiceAccountToken: false
imagePullSecrets:
  - name: gitea-registry
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: backend-dev-agent
  namespace: fleet-agents
automountServiceAccountToken: false
imagePullSecrets:
  - name: gitea-registry
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: reviewer-agent
  namespace: fleet-agents
automountServiceAccountToken: false
imagePullSecrets:
  - name: gitea-registry
