# Redis for LiteLLM distributed rate limiting / router state.
# Ephemeral by design: losing it resets in-flight rate-limit counters only
# (budgets and keys live in Postgres). No auth: reachable only inside fleet-core.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: fleet-core
  labels:
    app: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7.4-alpine
          args:
            - --maxmemory
            - 128mb
            - --maxmemory-policy
            - allkeys-lru
          ports:
            - containerPort: 6379
              name: redis
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 192Mi
          readinessProbe:
            tcpSocket:
              port: 6379
            initialDelaySeconds: 3
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: fleet-core
  labels:
    app: redis
spec:
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379
      name: redis
