# LiteLLM gateway — the ONLY place the real Anthropic key exists (risk #5).
# Agents authenticate with per-agent virtual keys carrying hard budgets (risk #2),
# generated by scripts/bootstrap.sh via /key/generate.
replicaCount: 1

# Pin a published image tag. Some chart defaults build `main-<version>`,
# which GHCR does not always publish.
image:
  repository: ghcr.io/berriai/litellm
  tag: v1.100.0
  pullPolicy: IfNotPresent

# Secrets created by scripts/bootstrap.sh (never in git):
#   litellm-master-key   key: masterkey       (admin key for /key/generate + UI)
#   litellm-env-secret   key: ANTHROPIC_API_KEY
masterkeySecretName: litellm-master-key
masterkeySecretKey: masterkey
environmentSecrets:
  - litellm-env-secret

# Keys/teams/spend live in the existing Patroni HA cluster (patroni-postgres-ha).
# The `litellm` db/user is declared in patroni-postgres-ha/helm-charts/postgres-ha/values.yaml;
# bootstrap.sh copies the operator-generated credentials secret into fleet-core.
db:
  useExisting: true
  deployStandalone: false  # do not spin up the chart's bundled Postgres
  endpoint: acid-postgres-cluster.postgres-ha.svc.cluster.local
  database: litellm
  secret:
    name: litellm-db-credentials
    usernameKey: username
    passwordKey: password
  # Include port; chart default omits it. Password still comes from the secret
  # via Kubernetes $(VAR) expansion — special characters are handled by `uri`.
  url: postgresql://$(DATABASE_USERNAME):$(DATABASE_PASSWORD)@$(DATABASE_HOST):5432/$(DATABASE_NAME)?sslmode=disable

# Last DATABASE_URL wins: use the pre-encoded uri from bootstrap (safe for @:/#).
extraEnvVars:
  - name: DATABASE_URL
    valueFrom:
      secretKeyRef:
        name: litellm-db-credentials
        key: uri

proxy_config:
  model_list:
    # Model aliases: agents ask for "claude-sonnet" / "claude-haiku"; swapping the
    # underlying model is an edit here, not a code change. Update to the latest
    # Anthropic models as they ship.
    - model_name: claude-sonnet
      litellm_params:
        model: anthropic/claude-sonnet-4-5
        api_key: os.environ/ANTHROPIC_API_KEY
    - model_name: claude-haiku
      litellm_params:
        model: anthropic/claude-haiku-4-5
        api_key: os.environ/ANTHROPIC_API_KEY
  litellm_settings:
    # Drop request/response bodies from logs; keep token counts + spend
    turn_off_message_logging: true
    num_retries: 2
    request_timeout: 600
  router_settings:
    # Distributed rate limiting / cooldowns across replicas
    redis_host: redis.fleet-core.svc.cluster.local
    redis_port: 6379
  general_settings:
    # Virtual keys are managed via API by bootstrap.sh; block anonymous access
    disable_spend_logs: false

service:
  type: ClusterIP
  port: 4000

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 1Gi

migrationJob:
  enabled: true
  # Do not use an Argo PreSync hook. A failed/deleted hook leaves the app
  # permanently "waiting for Job" and skips auto-sync. Run migrations as a
  # normal Job alongside the Deployment.
  hooks:
    argocd:
      enabled: false
    helm:
      enabled: false
  # LimitRange in fleet-core defaults unspecified containers to 512Mi. Prisma
  # inside the LiteLLM image OOMs at that size (the Job was OOMKilled).
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 2Gi
