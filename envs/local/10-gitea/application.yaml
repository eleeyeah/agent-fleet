apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: fleet-gitea-local
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io/background
spec:
  project: agent-fleet
  destination:
    server: https://kubernetes.default.svc
    namespace: fleet-git
  sources:
    - repoURL: https://dl.gitea.com/charts/
      chart: gitea
      # 11.x is the last series that still ships the act-runner subchart.
      # Chart 12+ moved Actions to a separate unpublished helm-actions chart
      # and fails render if `actions:` is present (that is why bootstrap stalled).
      targetRevision: 11.0.1
      helm:
        releaseName: gitea
        valueFiles:
          - $values/helm-values/gitea.yaml
    - repoURL: git@github.com:eleeyeah/agent-fleet.git
      targetRevision: HEAD
      ref: values
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - Validate=true
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
