apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: fleet-litellm-local
  namespace: argocd
  annotations:
    # Wave 2: needs redis (wave 1) and the Patroni litellm database
    argocd.argoproj.io/sync-wave: "2"
  finalizers:
    - resources-finalizer.argocd.argoproj.io/background
spec:
  project: agent-fleet
  destination:
    server: https://kubernetes.default.svc
    namespace: fleet-core
  sources:
    - repoURL: ghcr.io/berriai
      chart: litellm-helm
      # Chart versions track LiteLLM releases (1.x), not an internal 0.x series.
      # 0.4.1 does not exist on GHCR — that is why fleet-litellm-local stayed Unknown.
      targetRevision: 1.100.0
      helm:
        releaseName: litellm
        valueFiles:
          - $values/helm-values/litellm.yaml
    - repoURL: git@github.com:eleeyeah/agent-fleet.git
      targetRevision: HEAD
      ref: values
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - Validate=true
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
