apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: fleet-litellm-local
  namespace: argocd
  annotations:
    # Wave 2: needs redis (wave 1) and the Patroni litellm database
    argocd.argoproj.io/sync-wave: "2"
  finalizers:
    - resources-finalizer.argocd.argoproj.io/background
spec:
  project: agent-fleet
  destination:
    server: https://kubernetes.default.svc
    namespace: fleet-core
  sources:
    - repoURL: ghcr.io/berriai
      chart: litellm-helm
      # Pin when you settle on a version; check upstream chart releases
      targetRevision: 0.4.1
      helm:
        releaseName: litellm
        valueFiles:
          - $values/helm-values/litellm.yaml
    - repoURL: git@github.com:eleeyeah/agent-fleet.git
      targetRevision: HEAD
      ref: values
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - Validate=true
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
