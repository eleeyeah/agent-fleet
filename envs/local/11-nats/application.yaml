apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: fleet-nats-local
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io/background
spec:
  project: agent-fleet
  destination:
    server: https://kubernetes.default.svc
    namespace: fleet-core
  sources:
    - repoURL: https://nats-io.github.io/k8s/helm/charts/
      chart: nats
      # Pin when you settle on a version; check upstream chart releases
      targetRevision: 1.3.14
      helm:
        releaseName: nats
        valueFiles:
          - $values/helm-values/nats.yaml
    - repoURL: git@github.com:eleeyeah/agent-fleet.git
      targetRevision: HEAD
      ref: values
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - Validate=true
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
