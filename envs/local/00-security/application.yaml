apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: fleet-security-local
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io/background
spec:
  project: agent-fleet
  destination:
    server: https://kubernetes.default.svc
    # Manifests carry their own namespaces; Namespace objects are cluster-scoped
    namespace: fleet-agents
  source:
    repoURL: git@github.com:eleeyeah/agent-fleet.git
    targetRevision: HEAD
    path: manifests/security
    directory:
      recurse: true
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - Validate=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
